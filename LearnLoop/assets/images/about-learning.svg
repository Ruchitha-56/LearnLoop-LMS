<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 420" role="img" aria-label="A loop connecting Learn, Grow and Achieve">
<defs><linearGradient id="r" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#7950D9"/><stop offset="1" stop-color="#A987F5"/></linearGradient>
<radialGradient id="b" cx=".5" cy=".5" r=".5"><stop offset="0" stop-color="#A987F5" stop-opacity=".5"/><stop offset="1" stop-color="#A987F5" stop-opacity="0"/></radialGradient></defs>
<circle cx="250" cy="210" r="200" fill="url(#b)"/>
<circle cx="250" cy="210" r="130" fill="none" stroke="#DCCBFF" stroke-width="26"/>
<circle cx="250" cy="210" r="130" fill="none" stroke="url(#r)" stroke-width="26" stroke-linecap="round" stroke-dasharray="560 257" transform="rotate(-100 250 210)"/>
<circle cx="250" cy="210" r="86" fill="#fff" opacity=".92"/>
<text x="250" y="206" text-anchor="middle" font-family="Georgia,serif" font-size="30" font-weight="700" fill="#30204F">Loop</text>
<text x="250" y="232" text-anchor="middle" font-family="Arial,sans-serif" font-size="14" fill="#7950D9">keep going</text>
<g font-family="Arial,sans-serif" font-size="16" font-weight="700" text-anchor="middle">
<rect x="190" y="42" width="120" height="40" rx="20" fill="#7950D9"/><text x="250" y="68" fill="#fff">Learn</text>
<rect x="322" y="300" width="120" height="40" rx="20" fill="#A987F5"/><text x="382" y="326" fill="#fff">Grow</text>
<rect x="58" y="300" width="130" height="40" rx="20" fill="#DCCBFF"/><text x="123" y="326" fill="#30204F">Achieve</text></g>
<g fill="#A987F5"><circle cx="64" cy="110" r="7"/><circle cx="448" cy="130" r="10" opacity=".6"/><circle cx="430" cy="380" r="6"/><circle cx="40" cy="220" r="5" opacity=".7"/></g>
</svg>
